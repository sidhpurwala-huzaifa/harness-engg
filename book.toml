[book]
title = "Harness Engineering: Building the Machinery Around the Model"
description = "How to turn a raw language model into a dependable agent — loops, tools, context, sandboxes, verification, and orchestration."
authors = ["Huzaifa Sidhpurwala"]
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-icon = "fa-github"
git-repository-url = "https://github.com/sidhpurwala-huzaifa/harness-engg"
edit-url-template = "https://github.com/sidhpurwala-huzaifa/harness-engg/edit/main/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
